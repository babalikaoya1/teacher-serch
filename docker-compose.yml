services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: teacher_search
      POSTGRES_USER: teacher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在环境变量或 .env 文件中设置 POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - teacher-search-db:/var/lib/postgresql/data

volumes:
  teacher-search-db:
